# Public-key authentication only. Installed by `mise run ssh`.
# Tailscale reaches this host through this sshd (MagicDNS or the tailnet IP).
# Leave Tailscale SSH off so it does not bind port 22 on the tailnet address.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
