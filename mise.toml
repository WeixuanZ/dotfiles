# Task runner for these dotfiles. `mise run` links configs into $HOME.
# `mise tasks` lists everything the Makefile used to expose, plus the
# Linux terminal stack (tmux, alacritty, herdr, pi).

[tools]
tmux = "3.7c"

[tasks.default]
description = "Link all tracked dotfiles into $HOME"
depends = ["link"]
run = "true"

[tasks.link]
description = "Link all tracked dotfiles into $HOME"
run = "bash scripts/tasks.sh link"

[tasks.help]
description = "List tasks"
run = "mise tasks"

[tasks.brew]
description = "Install Homebrew (Linuxbrew on Linux)"
run = "bash scripts/tasks.sh brew"

[tasks.update-brewfile]
description = "Rewrite install/Brewfile and install/Appfile from the current machine"
depends = ["brew"]
run = "bash scripts/tasks.sh update-brewfile"

[tasks.update-installfile]
description = "Show uv tools. Edit install/uv-tools.txt by hand"
run = "bash scripts/tasks.sh update-installfile"

[tasks.tools]
description = "Install language toolchains and dev CLIs with mise and uv"
alias = ["python-packages", "node-packages"]
run = "bash scripts/tasks.sh tools"

[tasks.brew-packages]
description = "Install Homebrew packages from install/Brewfile"
run = "bash scripts/tasks.sh brew-packages"

[tasks.init]
description = "Install dev toolchains, uv tools, Homebrew packages, and SSH"
alias = ["install", "packages"]
depends = ["tools", "brew-packages", "ssh"]
run = "true"

[tasks.apps]
description = "Install macOS casks and Mac App Store apps from install/Appfile"
run = "bash scripts/tasks.sh apps"

[tasks.editor]
description = "Zed as the default editor for code files, and Quick Look previews (macOS)"
run = "bash scripts/tasks.sh editor"

[tasks.zsh]
description = "Install oh-my-zsh, plugins, and link .zshrc"
run = "bash scripts/tasks.sh zsh"

[tasks.vim]
description = "Install VimPlug and plugins, and link .vimrc"
run = "bash scripts/tasks.sh vim"

[tasks.vim-ycm]
description = "Install YouCompleteMe for all languages"
run = "bash scripts/tasks.sh vim-ycm"

[tasks.iterm2]
description = "Install and configure iTerm2 (macOS) and JetBrains Mono"
run = "bash scripts/tasks.sh iterm2"

[tasks.hammerspoon]
description = "Install Hammerspoon and Spoons (macOS)"
run = "bash scripts/tasks.sh hammerspoon"

[tasks.haskell]
description = "Install GHCup's recommended GHC, Cabal, Stack, and HLS"
run = "bash scripts/tasks.sh haskell"

[tasks.tmux]
description = "Install TPM, resurrect, and continuum; restore on login"
run = "bash scripts/tasks.sh tmux"

[tasks.alacritty]
description = "Install the Hack font and check the Alacritty config"
run = "bash scripts/tasks.sh alacritty"

[tasks.herdr]
description = "Install herdr, the pi integration, and the user service"
run = "bash scripts/tasks.sh herdr"

[tasks.pi]
description = "Install pi and the Claude, Gemini, Grok, subagent, and herdr packages"
run = "bash scripts/tasks.sh pi"

[tasks.claude]
description = "Install Claude Code and the claude-hud status line"
run = "bash scripts/tasks.sh claude"

[tasks.ssh]
description = "Public-key-only OpenSSH; Tailscale uses system ssh, not Tailscale SSH"
run = "bash scripts/tasks.sh ssh"

[tasks.linux]
description = "Link configs and set up zsh, tmux, Alacritty, herdr, pi, and SSH"
depends = ["link", "zsh", "tmux", "alacritty", "herdr", "pi", "ssh"]
run = "true"

[tasks.test]
description = "Check configs, the linker, tmux, clipboard, and herdr"
run = "bash scripts/test-dotfiles.sh"
