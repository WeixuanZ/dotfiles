# Global dev tools. `mise install` (part of `mise run init`) installs them all.
# Python CLIs use the pipx backend, which installs them with uv.

[tools]
node = "lts"
python = "3.14"
go = "1"
java = "lts"
uv = "latest"
"npm:pnpm" = "latest" # aqua has no Intel-Mac build of current pnpm
yarn = "latest"

gh = "latest"
terraform = "latest"
worktrunk = "latest"
yt-dlp = "latest"
"aqua:iffse/pay-respects" = "latest"
# On macOS aqua fetches the app installer, not a CLI; the Tailscale app
# (cask, `mise run tools`) ships its own CLI that matches its daemon.
"aqua:tailscale/tailscale" = { version = "latest", os = ["linux"] }
eza = { version = "latest", os = ["linux"] } # Homebrew on macOS
tmux = { version = "3.7c", os = ["linux"] } # Homebrew on macOS

ruff = "latest"
pre-commit = "latest"
"pipx:ipython" = "latest"
"pipx:neovim-remote" = "latest" # nvr; brings pynvim

"npm:typescript" = "latest"
"npm:prettier" = "latest"
"npm:eslint" = "latest"
