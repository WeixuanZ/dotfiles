# Majority of the key map and status style taken from
# https://gist.github.com/tsl0922/d79fc1f8097dde660b34 by Shuanglei Tao.
# Clipboard, terminal features, and resurrect/continuum are updated so the
# same file works on macOS, Linux, and over SSH.

set-option -g prefix C-space
unbind-key C-space
bind-key C-space send-prefix
set -g base-index 1
setw -g pane-base-index 1

# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# mouse behavior
setw -g mouse on

# tmux-256color plus truecolor. OSC 52 (Ms) is what makes copy work over SSH
# and inside Alacritty / iTerm / Windows Terminal. `set-clipboard on` tells
# tmux itself to emit OSC 52; the copy-pipe script below is the fallback that
# also talks to pbcopy / wl-copy / xclip when we are on the local machine.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc,alacritty:Tc,*:RGB"
set -as terminal-overrides ",xterm*:Ms=\\E]52;c;%p2%s\\007"
set -as terminal-overrides ",alacritty:Ms=\\E]52;c;%p2%s\\007"
set -as terminal-overrides ",tmux*:Ms=\\E]52;c;%p2%s\\007"
set -as terminal-features ",xterm*:clipboard"
set -as terminal-features ",alacritty:clipboard"
set -as terminal-features ",tmux-256color:clipboard"
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g history-limit 50000
# Stay up with zero sessions so a login unit can start the server and
# continuum can restore into it. `tmux kill-server` still stops it.
set -g exit-empty off

# Prefer zsh when it is installed, without hard-coding a prefix.
run-shell 'command -v zsh >/dev/null 2>&1 && tmux set -g default-shell "$(command -v zsh)"'

bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key v split-window -h
bind-key H split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)vim$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)vim$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)vim$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)vim$' && tmux send-keys C-l) || tmux select-pane -R"
bind -n 'C-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)vim$' && tmux send-keys 'C-\\\\') || tmux select-pane -l"
bind C-l send-keys 'C-l'

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500

bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

bind-key [ copy-mode
bind-key ] paste-buffer

# Copy via ~/.local/bin/tmux-clipboard (linked from this repo).
# Local macOS: pbcopy. Local Linux: wl-copy or xclip. SSH or no display
# server: OSC 52 to the outer terminal, so the laptop clipboard updates.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/tmux-clipboard"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "~/.local/bin/tmux-clipboard"

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Status Bar
set-option -g status-interval 1
set -g status-left-length 50
set-option -g status-style bg=black,fg=white
set-window-option -g window-status-current-style fg=magenta
set-window-option -g window-status-separator ''

set -g status-left "\
#[fg=colour8, bg=colour7]#{?client_prefix,#[bg=blue],} ❐ #S \
#[fg=colour7, bg=black]#{?client_prefix,#[fg=blue],}#{?window_zoomed_flag, 🔍 ,}"
set -g status-right ""

set-window-option -g window-status-current-format "\
#[fg=colour214, bold] #I \
#[fg=colour214, bold]#W "

set-window-option -g window-status-format "\
#[fg=colour7] #I \
#[fg=colour7]#W "

set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan

# --- persistence -----------------------------------------------------------
# tmux-resurrect snapshots the session. tmux-continuum writes that snapshot
# every 5 minutes and restores it the next time the tmux server starts.
# A reboot does not keep the server running, so misc/.local/bin/tmux-ensure
# starts it again: systemd user unit on Linux, LaunchAgent on macOS, and a
# zsh hook as a fallback (see zsh/.zshrc). @continuum-boot is left off
# because on macOS it opens Terminal.app, not iTerm / Alacritty.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vi vim nvim ssh psql "~pi"'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run "~/.tmux/plugins/tpm/tpm"'
